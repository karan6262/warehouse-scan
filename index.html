<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse Scanner V9</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --success: #10b981; 
            --danger: #ef4444; 
            --border: #334155; 
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { font-family: 'Inter', sans-serif; margin: 0; padding: 16px; background: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; }

        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 10px 0; }
        .header-title { display: flex; align-items: center; gap: 8px; }
        .header-title i { font-size: 28px; color: var(--primary); }
        .header-title h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .fullscreen-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 10px; cursor: pointer; display: flex; font-size: 20px; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-md); margin-bottom: 16px; border: 1px solid var(--border); }

        .input-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .select-wrapper { position: relative; }
        .select-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;}
        select { width: 100%; appearance: none; background: var(--bg-color); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; color: var(--text-main); outline: none; }
        
        .segmented-control { display: flex; background: var(--bg-color); padding: 4px; border-radius: 12px; margin-top: 16px; border: 1px solid var(--border); }
        .segmented-control label { flex: 1; text-align: center; padding: 10px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 10px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .segmented-control input[type="radio"] { display: none; }
        input[value="Inward"]:checked + label { background: var(--success); color: white; }
        input[value="Outward"]:checked + label { background: var(--danger); color: white; }

        .scanner-wrapper { position: relative; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--border); }
        .laser { position: absolute; left: 0; width: 100%; height: 2px; background: #ef4444; box-shadow: 0 0 10px 2px rgba(239, 68, 68, 0.5); z-index: 10; animation: scan-laser 2s infinite ease-in-out alternate; pointer-events: none; }
        @keyframes scan-laser { 0% { top: 10%; } 100% { top: 90%; } }
        #reader { border: none !important; }
        #reader img { display: none !important; }
        #reader button { background: var(--primary) !important; color: white !important; border: none !important; border-radius: 8px !important; padding: 8px 16px !important; font-weight: 600 !important; font-family: 'Inter', sans-serif !important; margin-bottom: 10px; }
        #reader__dashboard_section_csr span { color: var(--text-muted) !important; font-family: 'Inter', sans-serif !important; }

        .manual-entry { display: flex; background: var(--bg-color); border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin-top: 16px; }
        .manual-entry:focus-within { border-color: var(--primary); }
        .manual-entry input { flex: 1; border: none; background: transparent; padding: 10px 12px; font-size: 16px; outline: none; color: var(--text-main); }
        .manual-entry button { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .status-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); z-index: 1000; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 30px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow-lg); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; width: max-content; max-width: 90%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .status-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .list-header h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .clear-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px; }
        .scan-count { font-size: 13px; font-weight: 600; color: var(--text-main); background: var(--card-bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px; }
        
        .empty-state { text-align: center; padding: 30px 10px; color: var(--text-muted); }
        .empty-state i { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
        .empty-state p { margin: 0; font-size: 14px; font-weight: 500; }

        ul { list-style: none; padding: 0; margin: 0; }
        li { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; animation: slideIn 0.3s ease-out forwards; opacity: 0; transform: translateY(-10px); }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .scan-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .scan-info { display: flex; flex-direction: column; }
        .barcode-val { font-size: 18px; font-weight: 700; font-family: monospace; color: var(--text-main); word-break: break-all;}
        .scan-time { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 2px;}
        
        /* Delete Button Styles */
        .item-delete-btn { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: 0.2s; }
        .item-delete-btn:active { background: var(--danger); color: white; transform: scale(0.9); }

        .badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .bg-inward { background: rgba(6, 78, 59, 0.7); color: #34d399; }
        .bg-outward { background: rgba(127, 29, 29, 0.7); color: #f87171; }
        .bg-loc { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); }
        .bg-manual { background: rgba(120, 53, 15, 0.7); color: #fbbf24; }

        .export-btn { background: transparent; color: var(--success); border: 2px solid var(--success); padding: 14px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; transition: 0.2s; }
        .export-btn:disabled { border-color: var(--border); color: var(--text-muted); opacity: 0.5; }
    </style>
</head>
<body>
    
    <div id="syncStatus" class="status-toast"></div>

    <div class="container">
        <div class="app-header">
            <div class="header-title">
                <i class='bx bx-qr-scan'></i>
                <h2>Scanner V9</h2>
            </div>
            <button class="fullscreen-btn" onclick="toggleFullScreen()" title="Full Screen">
                <i class='bx bx-fullscreen'></i>
            </button>
        </div>

        <div class="card">
            <div class="input-label"><i class='bx bx-store-alt'></i> Active Location</div>
            <div class="select-wrapper">
                <select id="warehouse">
                    <option value="Ratanpole">Ratanpole</option>
                    <option value="94 Upper">94 Upper</option>
                    <option value="94 Lower">94 Lower</option>
                    <option value="95 Upper">95 Upper</option>
                    <option value="95 Lower">95 Lower</option>
                </select>
                <i class='bx bx-chevron-down'></i>
            </div>
            
            <div class="segmented-control">
                <input type="radio" id="inwardType" name="scanType" value="Inward" checked>
                <label for="inwardType"><i class='bx bx-down-arrow-circle'></i> Inward</label>
                
                <input type="radio" id="outwardType" name="scanType" value="Outward">
                <label for="outwardType"><i class='bx bx-up-arrow-circle'></i> Outward</label>
            </div>
        </div>

        <div class="card" style="padding: 0; border: none; background: transparent;">
            <div class="scanner-wrapper">
                <div class="laser"></div>
                <div id="reader"></div>
            </div>
        </div>
        
        <div class="card">
            <div class="input-label"><i class='bx bx-keyboard'></i> Manual Entry</div>
            <div class="manual-entry">
                <input type="text" id="manualBarcode" placeholder="Type barcode..." enterkeyhint="go"/>
                <button onclick="submitManualEntry()">Add</button>
            </div>
        </div>
        
        <div class="list-header">
            <h3>Recent Scans</h3>
            <div class="header-actions">
                <button class="clear-btn" onclick="clearList()" title="Clear List"><i class='bx bx-trash'></i></button>
                <span class="scan-count" id="scanCount">0 items</span>
            </div>
        </div>
        
        <div id="emptyState" class="empty-state">
            <i class='bx bx-box bx-tada'></i>
            <p>Awaiting your first scan...</p>
        </div>
        
        <ul id="scannedList"></ul>

        <button class="export-btn" id="exportBtn" onclick="exportToExcel()" disabled>
            <i class='bx bx-spreadsheet'></i> Backup to Excel
        </button>

    </div>

    <script>
        /* ==========================================
           PASTE YOUR GOOGLE SHEET WEB APP URL BELOW
           ========================================== */
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxwQiYnHggh4zzXe-4XoiojX02IyGp1Rjjey3r6tisnqrJab2VJxcrxpX8bkAoPJvG3/exec";
        /* ========================================== */

        let scannedItems = [];
        let toastTimeout;
        let isProcessing = false; 
        
        document.getElementById("manualBarcode").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                submitManualEntry();
            }
        });
        
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => { console.log(err); });
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }

        function triggerVibration(type) {
            if (!navigator.vibrate) return;
            if (type === 'success') navigator.vibrate(100); 
            if (type === 'error') navigator.vibrate([100, 50, 100]); 
        }

        function updateEmptyState() {
            const emptyState = document.getElementById("emptyState");
            if(scannedItems.length > 0) { emptyState.style.display = "none"; } 
            else { emptyState.style.display = "block"; }
        }

        function deleteSingleItem(barcode, btnElement) {
            if(confirm("Delete this scan? (This removes it from Google Sheets)")) {
                
                // Remove from UI visually
                let li = btnElement.closest('li');
                li.remove();
                
                // Remove from local array
                scannedItems = scannedItems.filter(item => item.Barcode !== barcode);
                document.getElementById("scanCount").innerText = `${scannedItems.length} items`;
                updateEmptyState();
                if(scannedItems.length === 0) document.getElementById("exportBtn").disabled = true;

                // Tell Google to Delete it
                showToast("<i class='bx bx-loader-alt bx-spin'></i> Deleting from sheet...", "rgba(15, 23, 42, 0.9)", "#38bdf8", true);
                
                const urlParams = new URLSearchParams();
                urlParams.append("barcode", barcode);
                urlParams.append("type", "Delete");
                urlParams.append("location", "");
                urlParams.append("timestamp", new Date().toLocaleString());

                fetch(GOOGLE_WEB_APP_URL, {
                    method: "POST",
                    body: urlParams
                })
                .then(response => response.text())
                .then(result => {
                    triggerVibration('success');
                    showToast("<i class='bx bx-trash'></i> Scan Deleted", "rgba(127, 29, 29, 0.9)", "#f87171", false);
                })
                .catch(err => {
                    triggerVibration('error');
                    showToast("<i class='bx bx-wifi-off'></i> Network Error", "rgba(120, 53, 15, 0.9)", "#fbbf24", false);
                });
            }
        }

        function addToListOnScreen(barcode, type, location, timestamp, isManual) {
            scannedItems.unshift({ Timestamp: timestamp, Barcode: barcode, Type: type, Location: location, Manual: isManual ? 'Yes' : 'No' });
            updateEmptyState();
            
            let li = document.createElement("li");
            let typeBadge = type === "Inward" 
                ? `<div class="badge bg-inward"><i class='bx bx-down-arrow-circle'></i> Inward</div>` 
                : `<div class="badge bg-outward"><i class='bx bx-up-arrow-circle'></i> Outward</div>`;
            
            let manualBadge = isManual ? `<div class="badge bg-manual"><i class='bx bx-keyboard'></i> Manual</div>` : '';
            
            li.innerHTML = `
                <div class="scan-top">
                    <div class="scan-info">
                        <span class="barcode-val">${barcode}</span>
                        <span class="scan-time">${timestamp.split(', ')[1]}</span>
                    </div>
                    <button class="item-delete-btn" onclick="deleteSingleItem('${barcode}', this)">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
                <div class="badges">
                    ${typeBadge}
                    <div class="badge bg-loc"><i class='bx bx-store-alt'></i> ${location}</div>
                    ${manualBadge}
                </div>
            `;
            
            const list = document.getElementById("scannedList");
            list.insertBefore(li, list.firstChild);
            
            document.getElementById("exportBtn").disabled = false;
            document.getElementById("scanCount").innerText = `${scannedItems.length} items`;
        }

        function processBarcode(decodedText, isManual = false) {
            if (isProcessing) return; 
            
            let scanType = document.querySelector('input[name="scanType"]:checked').value;
            let location = document.getElementById("warehouse").value;
            let timestamp = new Date().toLocaleString();
            
            if(scannedItems.find(item => item.Barcode === decodedText && item.Type === scanType)) {
                triggerVibration('error');
                showToast("<i class='bx bx-error'></i> Already scanned this session!", "rgba(120, 53, 15, 0.9)", "#fbbf24");
                return;
            }

            isProcessing = true;
            try { new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3').play(); } catch(e) {}
            showToast("<i class='bx bx-loader-alt bx-spin'></i> Verifying with sheet...", "rgba(15, 23, 42, 0.9)", "#38bdf8", true);

            const urlParams = new URLSearchParams();
            urlParams.append("barcode", decodedText);
            urlParams.append("type", scanType);
            urlParams.append("location", location);
            urlParams.append("timestamp", timestamp);

            fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                body: urlParams
            })
            .then(response => response.text())
            .then(result => {
                let serverMessage = result.trim();
                
                if (serverMessage === "Not Found") {
                    triggerVibration('error');
                    showToast("<i class='bx bx-x-circle'></i> Error: Inward Not Found!", "rgba(127, 29, 29, 0.9)", "#f87171", false);
                } 
                else if (serverMessage === "Duplicate") {
                    triggerVibration('error');
                    showToast("<i class='bx bx-error'></i> Error: Already Inwarded!", "rgba(120, 53, 15, 0.9)", "#fbbf24", false);
                } 
                else if (serverMessage === "Success") {
                    triggerVibration('success');
                    showToast("<i class='bx bx-check-circle'></i> " + scanType + " Successful", "rgba(6, 78, 59, 0.9)", "#34d399", false);
                    addToListOnScreen(decodedText, scanType, location, timestamp, isManual);
                } 
                else {
                    triggerVibration('error');
                    showToast("<i class='bx bx-error'></i> Unknown Error", "rgba(127, 29, 29, 0.9)", "#f87171", false);
                }
            })
            .catch(error => {
                triggerVibration('error');
                showToast("<i class='bx bx-wifi-off'></i> Network Error - Couldn't verify", "rgba(127, 29, 29, 0.9)", "#f87171", false);
            })
            .finally(() => {
                setTimeout(() => { isProcessing = false; }, 1000); 
            });
        }

        function onScanSuccess(decodedText, decodedResult) { processBarcode(decodedText, false); }

        function submitManualEntry() {
            let inputField = document.getElementById("manualBarcode");
            let manualCode = inputField.value.trim();
            if(manualCode !== "") {
                processBarcode(manualCode, true);
                inputField.value = ""; 
                inputField.blur(); 
            } else {
                triggerVibration('error');
                showToast("<i class='bx bx-x-circle'></i> Type a barcode first", "rgba(127, 29, 29, 0.9)", "#f87171");
            }
        }

        function showToast(htmlContent, bgColor, textColor, persist = false) {
            let toast = document.getElementById("syncStatus");
            clearTimeout(toastTimeout);
            toast.innerHTML = htmlContent;
            toast.style.backgroundColor = bgColor;
            toast.style.color = textColor;
            toast.style.border = `1px solid ${textColor}40`;
            toast.classList.add("show");
            
            if(!persist) {
                toastTimeout = setTimeout(() => { toast.classList.remove("show"); }, 2500);
            }
        }

        function clearList() {
            if(confirm("Clear the list from your screen? (This will not delete data from Google Sheets)")) {
                scannedItems = [];
                document.getElementById("scannedList").innerHTML = "";
                document.getElementById("scanCount").innerText = "0 items";
                document.getElementById("exportBtn").disabled = true;
                updateEmptyState();
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0, showTorchButtonIfSupported: true }, false);
        html5QrcodeScanner.render(onScanSuccess);

    </script>
</body>
</html>
