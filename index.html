<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse Scanner Pro</title>
    
    <!-- Modern Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Scanners and Export -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding-bottom: 40px;
        }

        .container { max-width: 500px; margin: 0 auto; }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .app-header i { font-size: 28px; color: var(--primary); }
        .app-header h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
        }

        /* Dropdown */
        .input-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .select-wrapper { position: relative; }
        .select-wrapper i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;}
        select {
            width: 100%;
            appearance: none;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus { border-color: var(--primary); }

        /* iOS Style Segmented Control */
        .segmented-control {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-top: 16px;
        }
        .segmented-control label {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .segmented-control input[type="radio"] { display: none; }
        input[value="Inward"]:checked + label { background: var(--success); color: white; box-shadow: var(--shadow-sm); }
        input[value="Outward"]:checked + label { background: var(--danger); color: white; box-shadow: var(--shadow-sm); }

        /* Camera Scanner Customization */
        #reader { 
            border: none !important; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #000;
        }
        #reader img { display: none !important; }
        #reader button {
            background: var(--primary) !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 8px 16px !important;
            font-weight: 600 !important;
            font-family: 'Inter', sans-serif !important;
        }
        #reader__dashboard_section_csr span { color: var(--text-muted) !important; font-family: 'Inter', sans-serif !important; }

        /* Modern Manual Entry */
        .manual-entry {
            display: flex;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
            transition: border-color 0.2s;
            margin-top: 16px;
        }
        .manual-entry:focus-within { border-color: var(--primary); }
        .manual-entry input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 12px;
            font-size: 16px;
            outline: none;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }
        .manual-entry button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .manual-entry button:active { background: var(--primary-hover); transform: scale(0.98); }

        /* Status Toast */
        .status-toast {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 16px;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* List Styles */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .list-header h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
        .list-header span { font-size: 13px; font-weight: 600; color: var(--text-muted); background: #e5e7eb; padding: 2px 8px; border-radius: 12px; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .scan-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .barcode-val { font-size: 18px; font-weight: 700; font-family: monospace; color: var(--text-main); word-break: break-all;}
        .scan-time { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        
        .badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .bg-inward { background: #d1fae5; color: #065f46; }
        .bg-outward { background: #fee2e2; color: #991b1b; }
        .bg-loc { background: #f3f4f6; color: #374151; }
        .bg-manual { background: #fef3c7; color: #92400e; }

        /* Export Button */
        .export-btn {
            background: white;
            color: #059669;
            border: 2px solid #059669;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
        }
        .export-btn:not(:disabled):active { background: #059669; color: white; }
        .export-btn:disabled { border-color: var(--border); color: var(--text-muted); cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="app-header">
            <i class='bx bx-barcode-reader'></i>
            <h2>Warehouse Scanner</h2>
        </div>

        <div class="card">
            <!-- WAREHOUSE SELECTION -->
            <div class="input-label"><i class='bx bx-store-alt'></i> Active Location</div>
            <div class="select-wrapper">
                <select id="warehouse">
                    <option value="Ratanpole">Ratanpole</option>
                    <option value="94 Upper">94 Upper</option>
                    <option value="94 Lower">94 Lower</option>
                    <option value="95 Upper">95 Upper</option>
                    <option value="95 Lower">95 Lower</option>
                </select>
                <i class='bx bx-chevron-down'></i>
            </div>
            
            <!-- INWARD / OUTWARD SELECTION -->
            <div class="segmented-control">
                <input type="radio" id="inwardType" name="scanType" value="Inward" checked>
                <label for="inwardType"><i class='bx bx-import'></i> Inward</label>
                
                <input type="radio" id="outwardType" name="scanType" value="Outward">
                <label for="outwardType"><i class='bx bx-export'></i> Outward</label>
            </div>
        </div>

        <!-- CAMERA SCANNER -->
        <div class="card" style="padding: 0;">
            <div id="reader"></div>
        </div>
        
        <!-- MANUAL ENTRY -->
        <div class="card">
            <div class="input-label"><i class='bx bx-keyboard'></i> Manual Entry</div>
            <div class="manual-entry">
                <input type="text" id="manualBarcode" placeholder="Type barcode..." enterkeyhint="go"/>
                <button onclick="submitManualEntry()">Add</button>
            </div>
        </div>
        
        <!-- TOAST NOTIFICATION -->
        <div id="syncStatus" class="status-toast"></div>
        
        <!-- SCANNED LIST -->
        <div class="list-header">
            <h3>Recent Scans</h3>
            <span id="scanCount">0 items</span>
        </div>
        <ul id="scannedList"></ul>

        <!-- BACKUP EXCEL -->
        <button class="export-btn" id="exportBtn" onclick="exportToExcel()" disabled>
            <i class='bx bx-spreadsheet'></i> Backup to Excel
        </button>

    </div>

    <script>
        /* ==========================================
           PASTE YOUR GOOGLE SHEET WEB APP URL BELOW
           ========================================== */
   const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwRErVy_ezJMtHvAYGxYHQQmqHG3IFZKAI3KQNRyQvn2egg_n24SFk-kSEQYW_aNU6t/exec";
        /* ========================================== */

        let scannedItems = [];
        
        // Allow pressing "Enter" on keyboard to submit manual entry
        document.getElementById("manualBarcode").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                submitManualEntry();
            }
        });
        
        function processBarcode(decodedText, isManual = false) {
            if(!scannedItems.find(item => item.Barcode === decodedText)) {
                
                try { new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3').play(); } catch(e) {}

                let timestamp = new Date().toLocaleString();
                let scanType = document.querySelector('input[name="scanType"]:checked').value;
                let location = document.getElementById("warehouse").value;
                
                scannedItems.unshift({ Timestamp: timestamp, Barcode: decodedText, Type: scanType, Location: location, Manual: isManual ? 'Yes' : 'No' });
                
                // Update UI List
                let li = document.createElement("li");
                let typeBadge = scanType === "Inward" 
                    ? `<div class="badge bg-inward"><i class='bx bx-import'></i> Inward</div>` 
                    : `<div class="badge bg-outward"><i class='bx bx-export'></i> Outward</div>`;
                
                let manualBadge = isManual ? `<div class="badge bg-manual"><i class='bx bx-keyboard'></i> Manual</div>` : '';
                
                li.innerHTML = `
                    <div class="scan-top">
                        <span class="barcode-val">${decodedText}</span>
                        <span class="scan-time">${timestamp.split(', ')[1]}</span>
                    </div>
                    <div class="badges">
                        ${typeBadge}
                        <div class="badge bg-loc"><i class='bx bx-store-alt'></i> ${location}</div>
                        ${manualBadge}
                    </div>
                `;
                
                const list = document.getElementById("scannedList");
                list.insertBefore(li, list.firstChild);
                
                document.getElementById("exportBtn").disabled = false;
                document.getElementById("scanCount").innerText = `${scannedItems.length} items`;

                // Send Data
                if (GOOGLE_WEB_APP_URL !== "YOUR_GOOGLE_SCRIPT_URL_HERE") {
                    sendToGoogleSheet(decodedText, scanType, location, timestamp);
                } else {
                    showStatus("<i class='bx bx-wifi-off'></i> Offline. Saved locally.", "#fef3c7", "#92400e");
                }
            } else {
                showStatus("<i class='bx bx-error'></i> Already scanned!", "#fef3c7", "#92400e");
                setTimeout(() => { document.getElementById("syncStatus").style.display = "none"; }, 2500);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            processBarcode(decodedText, false);
        }

        function submitManualEntry() {
            let inputField = document.getElementById("manualBarcode");
            let manualCode = inputField.value.trim();
            
            if(manualCode !== "") {
                processBarcode(manualCode, true);
                inputField.value = ""; 
                inputField.blur(); // Hide keyboard
            } else {
                showStatus("<i class='bx bx-x-circle'></i> Type a barcode first", "#fee2e2", "#991b1b");
                setTimeout(() => { document.getElementById("syncStatus").style.display = "none"; }, 2500);
            }
        }

        function sendToGoogleSheet(barcode, type, location, timestamp) {
            showStatus("<i class='bx bx-loader-alt bx-spin'></i> Syncing...", "#e0f2fe", "#0369a1");
            
            const urlParams = new URLSearchParams();
            urlParams.append("barcode", barcode);
            urlParams.append("type", type);
            urlParams.append("location", location);
            urlParams.append("timestamp", timestamp);

            fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                body: urlParams,
                mode: "no-cors" 
            }).then(() => {
                showStatus("<i class='bx bx-check-circle'></i> Synced to Google Sheet", "#d1fae5", "#065f46");
                setTimeout(() => { document.getElementById("syncStatus").style.display = "none"; }, 3000);
            }).catch(error => {
                showStatus("<i class='bx bx-cloud-light-rain'></i> Sync failed. Backup to Excel.", "#fee2e2", "#991b1b");
            });
        }

        function showStatus(htmlContent, bgColor, textColor) {
            let status = document.getElementById("syncStatus");
            status.innerHTML = htmlContent;
            status.style.backgroundColor = bgColor;
            status.style.color = textColor;
            status.style.display = "flex";
        }

        // Initialize Scanner with customized UI
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: {width: 250, height: 250}, 
            aspectRatio: 1.0,
            showTorchButtonIfSupported: true 
        }, false);
        html5QrcodeScanner.render(onScanSuccess);

        function exportToExcel() {
            if(scannedItems.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(scannedItems);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Warehouse Data");
            XLSX.writeFile(wb, "Warehouse_Scans_" + new Date().toISOString().slice(0,10) + ".xlsx");
        }
    </script>
</body>
</html>
